<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 문장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FBF8EF;
  --line: #D5E3EF;
  --margin: #F1B3B0;
  --ink: #2A2622;
  --ink-soft: #6B635A;
  --strip: #FFFDF7;
  --hill: #A8D48A;
  --blue: #BBD6F7;
  --yellow: #F6EFBF;
  --pink: #F8D6CF;
  --green: #CFE8BC;
  --lavender: #DCCBF2;
  --shadow: rgba(60, 45, 20, .14);
  --font-ui: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-hand: "Gaegu", "Nanum Pen Script", "Apple SD Gothic Neo", cursive;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1F2430; --line: #2C3546; --margin: #6E3E44; --ink: #EFE9DC; --ink-soft: #ABA394;
    --strip: #2A3140; --hill: #4F7A3E; --blue: #34506F; --yellow: #5B5430; --pink: #64403B;
    --green: #3D5734; --lavender: #4C3F66; --shadow: rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1F2430; --line: #2C3546; --margin: #6E3E44; --ink: #EFE9DC; --ink-soft: #ABA394;
  --strip: #2A3140; --hill: #4F7A3E; --blue: #34506F; --yellow: #5B5430; --pink: #64403B;
  --green: #3D5734; --lavender: #4C3F66; --shadow: rgba(0,0,0,.4); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font-ui);
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, transparent 38px, var(--margin) 38px, var(--margin) 40px, transparent 40px),
    repeating-linear-gradient(180deg, transparent 0 31px, var(--line) 31px 32px);
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }

.wrap { max-width: 620px; margin: 0 auto; padding: 20px 20px 160px 56px; position: relative; }

/* header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 8px; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-size: 1.6rem; letter-spacing: -.02em; }
.logo svg { width: 38px; height: 38px; flex: none; }
.today { font-family: var(--font-hand); font-size: 1.25rem; color: var(--ink-soft); white-space: nowrap; }

nav { display: flex; gap: 10px; margin: 22px 0 30px; flex-wrap: wrap; }
.tab {
  background: var(--strip); border: 2px solid var(--ink); padding: 6px 16px 5px; font-size: 1.05rem;
  border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  transition: transform .15s;
}
.tab:hover { transform: rotate(-1.5deg); }
.tab[aria-current="page"] { background: var(--blue); }
.tab .count { font-size: .85rem; margin-left: 4px; color: var(--ink-soft); }

/* torn paper strip */
.strip {
  position: relative; background: var(--strip); padding: 30px 30px 34px;
  filter: drop-shadow(0 4px 6px var(--shadow));
  clip-path: polygon(0% 3%, 4% 0%, 9% 2%, 15% 0%, 22% 3%, 30% 1%, 38% 3%, 46% 0%, 55% 2%, 63% 0%, 71% 3%, 79% 1%, 87% 3%, 94% 0%, 100% 2%,
    99% 20%, 100% 40%, 98% 60%, 100% 80%, 99% 97%,
    94% 100%, 86% 98%, 78% 100%, 69% 97%, 60% 100%, 51% 98%, 42% 100%, 33% 97%, 24% 100%, 15% 98%, 7% 100%, 0% 97%,
    1% 78%, 0% 58%, 2% 38%, 0% 18%);
}
.heading-strip {
  display: inline-block; font-size: 1.7rem; padding: 10px 26px 8px; margin: 0 0 22px; transform: rotate(-1.2deg);
}

/* sentence card */
.card { transform: rotate(-.8deg); min-height: 230px; display: flex; flex-direction: column; justify-content: center; }
.card.flip { animation: flip .45s ease; }
@keyframes flip {
  0% { transform: rotate(-.8deg) rotateX(0); opacity: 1; }
  45% { transform: rotate(1deg) rotateX(80deg); opacity: .2; }
  100% { transform: rotate(-.8deg) rotateX(0); opacity: 1; }
}
.tag {
  align-self: flex-start; font-size: .9rem; padding: 2px 12px; margin-bottom: 14px;
  border: 1.5px solid var(--ink); border-radius: 999px 40px 999px 60px;
}
.quote { font-family: var(--font-hand); font-weight: 700; font-size: clamp(1.7rem, 6vw, 2.3rem); line-height: 1.35; margin: 0; word-break: keep-all; }
.author { font-family: var(--font-hand); font-size: 1.3rem; color: var(--ink-soft); margin: 16px 0 0; text-align: right; }

.actions { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
.btn {
  border: 2px solid var(--ink); background: var(--yellow); padding: 10px 22px 8px; font-size: 1.15rem;
  border-radius: 15px 225px 15px 255px / 255px 15px 225px 15px; box-shadow: 3px 3px 0 var(--ink);
  transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn.ghost { background: var(--strip); }
.btn[aria-pressed="true"] { background: var(--pink); }

/* categories */
.cats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 26px; }
.cat {
  border: 2px solid var(--ink); padding: 8px 18px 6px; font-size: 1.1rem; background: var(--strip);
  border-radius: 225px 15px 255px 15px / 15px 255px 15px 225px;
}
.cat[aria-pressed="true"] { background: var(--c); transform: rotate(-2deg); }
.hint { font-family: var(--font-hand); font-size: 1.35rem; color: var(--ink-soft); }

/* saved */
.saved-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 22px; }
.saved-item { padding: 22px 24px 24px; }
.saved-item:nth-child(odd) { transform: rotate(-.6deg); }
.saved-item:nth-child(even) { transform: rotate(.6deg); }
.saved-item .quote { font-size: 1.5rem; }
.saved-item .author { font-size: 1.15rem; margin-top: 8px; }
.saved-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 10px; }
.unsave { background: none; border: none; font-size: .95rem; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.empty { text-align: center; padding: 30px 10px; }
.empty p { font-family: var(--font-hand); font-size: 1.5rem; margin: 0 0 18px; }

/* hill & bunny */
.hill { position: fixed; left: 50%; bottom: -260px; width: 560px; height: 340px; transform: translateX(-50%);
  background: var(--hill); border: 3px solid var(--ink); border-radius: 50%; z-index: -1; }
.bunny { position: fixed; left: 50%; bottom: 62px; width: 64px; transform: translateX(-50%); z-index: -1; }
.bunny.hop { animation: hop .5s ease; }
@keyframes hop { 40% { transform: translate(-50%, -22px); } }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--paper); padding: 10px 20px 8px; border-radius: 999px; opacity: 0;
  transition: opacity .2s, transform .2s; pointer-events: none; font-size: 1rem; z-index: 5;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

[hidden] { display: none !important; }
@media (max-width: 480px) {
  body { background-image: repeating-linear-gradient(180deg, transparent 0 31px, var(--line) 31px 32px); }
  .wrap { padding-left: 18px; padding-right: 18px; }
  .strip { padding: 24px 22px 28px; }
  .today { font-size: 1.05rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#home" aria-label="오늘의 문장 홈">
      <svg viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="20" cy="20" r="8" fill="#F6EFBF"/><path d="M20 4v5M20 31v5M4 20h5M31 20h5M8.7 8.7l3.5 3.5M27.8 27.8l3.5 3.5M8.7 31.3l3.5-3.5M27.8 12.2l3.5-3.5"/>
        <path d="M17 21.5q3 2.5 6 0"/></g><circle cx="17.3" cy="18" r="1.1" fill="currentColor"/><circle cx="22.7" cy="18" r="1.1" fill="currentColor"/></svg>
      오늘의 문장
    </a>
    <span class="today" id="today"></span>
  </header>

  <nav aria-label="메뉴">
    <button class="tab" data-view="home">홈</button>
    <button class="tab" data-view="category">카테고리</button>
    <button class="tab" data-view="saved">저장한 문장<span class="count" id="savedCount"></span></button>
  </nav>

  <main>
    <section id="view-home">
      <div class="strip card" id="homeCard"></div>
      <div class="actions">
        <button class="btn" id="drawBtn">오늘의 문장 뽑기</button>
        <button class="btn ghost" id="homeSave" aria-pressed="false">저장하기</button>
      </div>
    </section>

    <section id="view-category" hidden>
      <div class="cats" id="cats" role="group" aria-label="카테고리 선택"></div>
      <p class="hint" id="catHint">지금 필요한 문장을 골라 보세요.</p>
      <div id="catArea" hidden>
        <div class="strip card" id="catCard"></div>
        <div class="actions">
          <button class="btn" id="catDraw">다른 문장 뽑기</button>
          <button class="btn ghost" id="catSave" aria-pressed="false">저장하기</button>
        </div>
      </div>
    </section>

    <section id="view-saved" hidden>
      <h2 class="strip heading-strip">저장한 문장</h2>
      <ul class="saved-list" id="savedList"></ul>
      <div class="empty" id="savedEmpty" hidden>
        <p>아직 저장한 문장이 없어요.<br>마음에 드는 문장을 만나면 저장해 보세요.</p>
        <button class="btn" data-go="home">문장 뽑으러 가기</button>
      </div>
    </section>
  </main>
</div>

<div class="hill" aria-hidden="true"></div>
<svg class="bunny" id="bunny" viewBox="0 0 64 70" aria-hidden="true">
  <g stroke="#2A2622" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="#fff">
    <path d="M22 30 C17 12 18 3 24 3 C29 3 29 15 28 28"/>
    <path d="M38 28 C37 14 39 3 44 4 C50 5 47 16 42 30"/>
    <path d="M14 46 C12 30 22 25 32 25 C44 25 52 31 50 46 C48 58 42 66 32 66 C21 66 15 58 14 46 Z"/>
  </g>
  <circle cx="25" cy="42" r="2.2" fill="#2A2622"/><circle cx="39" cy="42" r="2.2" fill="#2A2622"/>
  <path d="M29 48 q3 3 6 0" fill="none" stroke="#2A2622" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="20" cy="49" r="2.5" fill="#F8C9C0"/><circle cx="44" cy="49" r="2.5" fill="#F8C9C0"/>
</svg>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const CATS = [
  { id: "comfort", name: "위로", color: "var(--pink)" },
  { id: "motivation", name: "동기부여", color: "var(--yellow)" },
  { id: "love", name: "사랑", color: "var(--lavender)" },
  { id: "people", name: "인간관계", color: "var(--green)" },
  { id: "study", name: "공부", color: "var(--blue)" }
];
const S = [
  ["comfort", "이 또한 지나가리라.", "옛 격언"],
  ["comfort", "비 온 뒤에 땅이 굳어진다.", "한국 속담"],
  ["comfort", "고생 끝에 낙이 온다.", "한국 속담"],
  ["comfort", "쥐구멍에도 볕 들 날 있다.", "한국 속담"],
  ["comfort", "쉬어 가도 괜찮아. 멈춘 게 아니라 숨을 고르는 중이니까.", "오늘의 문장"],
  ["comfort", "오늘 잘 해내지 못했어도, 오늘을 버텨낸 것만으로 충분해.", "오늘의 문장"],
  ["comfort", "모든 꽃이 같은 계절에 피지는 않는다.", "오늘의 문장"],
  ["comfort", "눈물과 함께 빵을 먹어 보지 않은 사람은 인생의 맛을 모른다.", "괴테"],
  ["motivation", "천 리 길도 한 걸음부터.", "한국 속담"],
  ["motivation", "시작이 반이다.", "한국 속담"],
  ["motivation", "낙숫물이 댓돌을 뚫는다.", "한국 속담"],
  ["motivation", "천재는 1%의 영감과 99%의 노력으로 이루어진다.", "토머스 에디슨"],
  ["motivation", "나는 천천히 가지만, 결코 뒤로 가지는 않는다.", "에이브러햄 링컨"],
  ["motivation", "오늘의 작은 한 걸음이 내일의 큰 차이를 만든다.", "오늘의 문장"],
  ["motivation", "완벽한 때는 오지 않아. 지금 시작하는 때가 있을 뿐.", "오늘의 문장"],
  ["love", "사랑은 오래 참고, 사랑은 온유하며.", "고린도전서 13장"],
  ["love", "사랑받고 싶다면 사랑하라, 그리고 사랑스러워져라.", "벤저민 프랭클린"],
  ["love", "사랑은 눈으로 보지 않고 마음으로 본다.", "셰익스피어, 「한여름 밤의 꿈」"],
  ["love", "진정한 사랑의 길은 결코 순탄하지 않았다.", "셰익스피어, 「한여름 밤의 꿈」"],
  ["love", "제 눈에 안경.", "한국 속담"],
  ["love", "가장 좋은 선물은 함께 보내는 시간이다.", "오늘의 문장"],
  ["love", "좋아하는 마음은 숨겨도 티가 난다.", "오늘의 문장"],
  ["people", "가는 말이 고와야 오는 말이 곱다.", "한국 속담"],
  ["people", "말 한마디로 천 냥 빚을 갚는다.", "한국 속담"],
  ["people", "백지장도 맞들면 낫다.", "한국 속담"],
  ["people", "친구란 두 몸에 깃든 하나의 영혼이다.", "아리스토텔레스"],
  ["people", "세 사람이 길을 가면 그중에 반드시 나의 스승이 있다.", "공자, 『논어』"],
  ["people", "내가 원하지 않는 일은 남에게도 하지 말라.", "공자, 『논어』"],
  ["people", "좋은 사람 곁에 있으면 나도 조금씩 좋은 사람이 된다.", "오늘의 문장"],
  ["study", "배우고 때때로 익히면 또한 기쁘지 아니한가.", "공자, 『논어』"],
  ["study", "배우기만 하고 생각하지 않으면 얻는 것이 없다.", "공자, 『논어』"],
  ["study", "아는 것이 힘이다.", "프랜시스 베이컨"],
  ["study", "티끌 모아 태산.", "한국 속담"],
  ["study", "늦었다고 생각할 때가 가장 빠를 때다.", "격언"],
  ["study", "오늘 공부한 한 페이지가 내일의 나를 지켜 준다.", "오늘의 문장"],
  ["study", "어제보다 한 줄 더 알게 된 것, 그게 오늘의 성장이다.", "오늘의 문장"]
].map(([cat, text, author], i) => ({ id: "s" + i, cat, text, author }));

const $ = id => document.getElementById(id);
const catOf = id => CATS.find(c => c.id === id);
const KEY = "today-sentence-saved";

let saved = [];
try { saved = JSON.parse(localStorage.getItem(KEY) || "[]").filter(id => S.some(s => s.id === id)); } catch (e) { saved = []; }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

// date + today's sentence (same all day)
const now = new Date();
const days = ["일", "월", "화", "수", "목", "금", "토"];
$("today").textContent = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 ${days[now.getDay()]}요일`;
const seed = [...`${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

let homeS = S[seed % S.length];
let catS = null, currentCat = null;

function renderCard(el, s, animate) {
  const c = catOf(s.cat);
  el.innerHTML = `<span class="tag" style="background:${c.color}">${c.name}</span>
    <p class="quote">${s.text}</p><p class="author">— ${s.author}</p>`;
  if (animate) { el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip"); hop(); }
}
function setSaveBtn(btn, s) {
  const on = !!s && saved.includes(s.id);
  btn.setAttribute("aria-pressed", on);
  btn.textContent = on ? "저장됨" : "저장하기";
}
function pick(pool, not) {
  const list = pool.length > 1 ? pool.filter(s => s !== not) : pool;
  return list[Math.floor(Math.random() * list.length)];
}
function toggleSave(s) {
  if (saved.includes(s.id)) { saved = saved.filter(id => id !== s.id); toast("저장을 취소했어요"); }
  else { saved.unshift(s.id); toast("저장했어요"); }
  persist(); refresh();
}
function refresh() {
  setSaveBtn($("homeSave"), homeS);
  setSaveBtn($("catSave"), catS);
  $("savedCount").textContent = saved.length ? saved.length : "";
  renderSaved();
}
function renderSaved() {
  const list = $("savedList");
  list.innerHTML = "";
  $("savedEmpty").hidden = saved.length > 0;
  saved.forEach(id => {
    const s = S.find(x => x.id === id), c = catOf(s.cat);
    const li = document.createElement("li");
    li.className = "strip saved-item";
    li.innerHTML = `<p class="quote">${s.text}</p><p class="author">— ${s.author}</p>
      <div class="saved-foot"><span class="tag" style="background:${c.color};margin:0">${c.name}</span>
      <button class="unsave">저장 취소</button></div>`;
    li.querySelector(".unsave").onclick = () => toggleSave(s);
    list.appendChild(li);
  });
}
let tt;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1600);
}
function hop() { const b = $("bunny"); b.classList.remove("hop"); void b.getBoundingClientRect(); b.classList.add("hop"); }

// categories
CATS.forEach(c => {
  const b = document.createElement("button");
  b.className = "cat"; b.textContent = c.name; b.style.setProperty("--c", c.color);
  b.setAttribute("aria-pressed", "false");
  b.onclick = () => {
    currentCat = c.id;
    document.querySelectorAll(".cat").forEach(x => x.setAttribute("aria-pressed", x === b));
    catS = pick(S.filter(s => s.cat === c.id), catS);
    $("catHint").hidden = true; $("catArea").hidden = false;
    renderCard($("catCard"), catS, true); refresh();
  };
  $("cats").appendChild(b);
});

$("drawBtn").onclick = () => { homeS = pick(S, homeS); renderCard($("homeCard"), homeS, true); refresh(); };
$("homeSave").onclick = () => toggleSave(homeS);
$("catDraw").onclick = () => { catS = pick(S.filter(s => s.cat === currentCat), catS); renderCard($("catCard"), catS, true); refresh(); };
$("catSave").onclick = () => catS && toggleSave(catS);

// views
const VIEWS = ["home", "category", "saved"];
function show(v) {
  if (!VIEWS.includes(v)) v = "home";
  VIEWS.forEach(x => $("view-" + x).hidden = x !== v);
  document.querySelectorAll(".tab").forEach(t => t.dataset.view === v ? t.setAttribute("aria-current", "page") : t.removeAttribute("aria-current"));
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { location.hash = b.dataset.view; show(b.dataset.view); });
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { location.hash = b.dataset.go; show(b.dataset.go); });
document.querySelector(".logo").onclick = e => { e.preventDefault(); location.hash = "home"; show("home"); };
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

renderCard($("homeCard"), homeS, false);
refresh();
show(location.hash.slice(1) || "home");
