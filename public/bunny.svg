<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 136" role="img" aria-label="언덕 위 토끼" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- 선을 살짝 삐뚤게 만들어 손그림 느낌을 냄 -->
    <filter id="sketch" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#sketch)" stroke="#1f1b17" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff">
    <!-- 몸통 (언덕 뒤로 내려감) -->
    <path d="M40 94 C33 107 32 121 33 136 L89 136 C90 121 89 107 82 94 Z"/>
    <!-- 왼쪽 귀 -->
    <path d="M45 60 C39 42 33 24 37 13 C41 3 51 6 52 17 C54 30 54 45 54 58"/>
    <!-- 오른쪽 귀 (살짝 기울어짐) -->
    <path d="M67 57 C69 42 74 26 82 17 C90 9 98 15 93 26 C88 38 81 49 76 60"/>
    <!-- 머리 -->
    <path d="M29 80 C27 62 42 53 60 53 C79 53 93 62 92 80 C92 97 78 106 60 106 C42 106 30 97 29 80 Z"/>
    <!-- 손 흔드는 팔 -->
    <path d="M85 106 C93 100 99 93 103 86 C106 81 112 84 109 90 C105 99 97 107 89 113"/>
  </g>
  <g filter="url(#sketch)">
    <!-- 눈 -->
    <ellipse cx="49" cy="76" rx="3.2" ry="3.8" fill="#1f1b17"/>
    <ellipse cx="72" cy="74" rx="3.2" ry="3.8" fill="#1f1b17"/>
    <!-- 동그랗게 벌린 입 -->
    <ellipse cx="61" cy="87" rx="3.6" ry="4.2" fill="#ffffff" stroke="#1f1b17" stroke-width="3"/>
  </g>
</svg>
