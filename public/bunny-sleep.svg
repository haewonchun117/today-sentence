<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 136" role="img" aria-label="잠자는 토끼">
  <!-- bunny.svg 와 같은 선으로 그린 잠자는 모습: 눈을 감고, 흔들던 손은 내렸다 -->
  <defs>
    <!-- 선을 살짝 삐뚤게 만들어 손그림 느낌을 냄 -->
    <filter id="sketch" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#sketch)" stroke="#1f1b17" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="#ffffff">
    <!-- 몸통 (언덕 뒤로 내려감) -->
    <path d="M40 94 C33 107 32 121 33 136 L89 136 C90 121 89 107 82 94 Z"/>
    <!-- 왼쪽 귀 -->
    <path d="M45 60 C39 42 33 24 37 13 C41 3 51 6 52 17 C54 30 54 45 54 58"/>
    <!-- 오른쪽 귀 (살짝 기울어짐) -->
    <path d="M67 57 C69 42 74 26 82 17 C90 9 98 15 93 26 C88 38 81 49 76 60"/>
    <!-- 머리 -->
    <path d="M29 80 C27 62 42 53 60 53 C79 53 93 62 92 80 C92 97 78 106 60 106 C42 106 30 97 29 80 Z"/>
  </g>
  <g filter="url(#sketch)" fill="none" stroke="#1f1b17" stroke-linecap="round">
    <!-- 감은 눈 -->
    <path d="M43.5 76 q5.5 4.5 11 0" stroke-width="3.2"/>
    <path d="M66.5 74 q5.5 4.5 11 0" stroke-width="3.2"/>
    <!-- 새근새근 작은 입 -->
    <ellipse cx="61" cy="89" rx="2.2" ry="2.6" fill="#ffffff" stroke-width="2.6"/>
  </g>
</svg>
